<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A small, personal time tracker." />
    <meta name="color-scheme" content="light dark" />
    <!-- Kept in step with light/dark by src/main.ts: an installed Android app ignores
         the media attribute and would otherwise keep the manifest's light colour. -->
    <meta name="theme-color" content="#f3f4f7" />
    <!-- Installed app: draw under the status bar so the theme reaches the top edge (iOS). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clocky" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Clocky</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
